name: scratch-unskip-probe
on:
  push:
    branches: ["scratch/unskip-probe"]
permissions:
  contents: read
jobs:
  win:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kirodotdev/KiroCrew
          ref: 39f27b1262ce3e5be3f6f021edf5e2b98b2f1a86
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false
      - uses: ./.github/actions/setup-windows-tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv pip install --system -e ".[voice,desktop]" --group dev
      - name: run
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/probe;${{ github.workspace }}
          UNSKIP_OUT: ${{ github.workspace }}/unskip.jsonl
        run: |
          python -m pytest -q -n auto --timeout=120 --no-cov -p no:cacheprovider -p scratch_unskip -k 'not MacOS and not macos and not Darwin and not darwin' $(tr -d '\r' < probe/probe-files.txt | awk -v s=${{ matrix.shard }} 'NR % 4 == s') || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unskip-${{ matrix.shard }}
          path: unskip.jsonl.*
