name: scratch-symlink-probe
on:
  push:
    branches: ["scratch/pod-peer-red"]
permissions:
  contents: read
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows-tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv pip install --system -e ".[voice,desktop]" --group dev
      - name: probe
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd test && python -c "import conftest; print('HAS_SYMLINKS', conftest._HAS_SYMLINKS)"
      - name: run
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q -n auto --timeout=180 --no-cov --max-worker-restart=0 -rfEs -p no:cacheprovider test/test_pod.py
