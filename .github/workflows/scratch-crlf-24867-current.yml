name: scratch-crlf-24867-current
on:
  workflow_dispatch:
  push:
    branches: ["scratch/codex-crlf-24867-current-20261101"]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20e32cf04c0c2825a1ff476ff34196f97f52e2ef
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: reconstruct and assert exact final HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/kirodotdev/KiroCrew.git 2f0313b2d34d9e86e352273a9ef41ec27724455c
          git checkout --detach 2f0313b2d34d9e86e352273a9ef41ec27724455c
          git diff --binary 20e32cf04c0c2825a1ff476ff34196f97f52e2ef^ 20e32cf04c0c2825a1ff476ff34196f97f52e2ef | git apply --index
          test "$(git write-tree)" = d6def7ff37d665065f9c81d2f142898c77b9c2b0
          python - <<'PY'
          import subprocess
          raw = b'tree d6def7ff37d665065f9c81d2f142898c77b9c2b0\nparent 2f0313b2d34d9e86e352273a9ef41ec27724455c\nauthor Leon <leon.lai.yc@gmail.com> 1793100915 +0800\ncommitter Leon <leon.lai.yc@gmail.com> 1793536940 +0800\n\ntest: read contract fixtures with either newline convention\n'
          sha = subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'], input=raw).decode().strip()
          assert sha == '9e73c90df84257c1bd20bb996fa2803d4f3de709', sha
          print('RECONSTRUCTED_FINAL_HEAD', sha)
          PY
          git checkout --detach 9e73c90df84257c1bd20bb996fa2803d4f3de709
          git update-ref refs/remotes/origin/main 2f0313b2d34d9e86e352273a9ef41ec27724455c
          git rev-parse HEAD HEAD^{tree} origin/main
          test -z "$(git status --porcelain)"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv pip install --system -e ".[voice,desktop]" --group dev
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-tests
      - name: record runner symlink capability
        shell: bash
        run: cd test && python -c "import conftest; print('HAS_SYMLINKS', conftest._HAS_SYMLINKS)"
      - name: required backend selection unchanged
        shell: bash
        run: |
          BASE="$(git merge-base HEAD origin/main)" && SCOPED_TESTS_BASE_REF="$BASE" python scripts/run_scoped_tests.py --surface backend
      - name: explicit symlink regression nodes
        if: always()
        shell: bash
        run: |
          python -m pytest -q --no-cov -p no:cacheprovider -rfEs \
            "src/kiro_crew/apps/builtins/aws_control/crew/packaging/tests/test_concurrent_builds_and_markers.py::test_a_link_at_the_spec_itself_is_still_refused" \
            "src/kiro_crew/apps/builtins/aws_control/crew/packaging/tests/test_entry_shapes_and_preflight_order.py::test_the_report_preflight_judges_the_entry_before_reading_it"
      - name: assert final HEAD after tests
        if: always()
        shell: bash
        run: test "$(git rev-parse HEAD)" = 9e73c90df84257c1bd20bb996fa2803d4f3de709
  linux-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20e32cf04c0c2825a1ff476ff34196f97f52e2ef
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: reconstruct and assert exact final HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/kirodotdev/KiroCrew.git 2f0313b2d34d9e86e352273a9ef41ec27724455c
          git checkout --detach 2f0313b2d34d9e86e352273a9ef41ec27724455c
          git diff --binary 20e32cf04c0c2825a1ff476ff34196f97f52e2ef^ 20e32cf04c0c2825a1ff476ff34196f97f52e2ef | git apply --index
          test "$(git write-tree)" = d6def7ff37d665065f9c81d2f142898c77b9c2b0
          python - <<'PY'
          import subprocess
          raw = b'tree d6def7ff37d665065f9c81d2f142898c77b9c2b0\nparent 2f0313b2d34d9e86e352273a9ef41ec27724455c\nauthor Leon <leon.lai.yc@gmail.com> 1793100915 +0800\ncommitter Leon <leon.lai.yc@gmail.com> 1793536940 +0800\n\ntest: read contract fixtures with either newline convention\n'
          sha = subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'], input=raw).decode().strip()
          assert sha == '9e73c90df84257c1bd20bb996fa2803d4f3de709', sha
          print('RECONSTRUCTED_FINAL_HEAD', sha)
          PY
          git checkout --detach 9e73c90df84257c1bd20bb996fa2803d4f3de709
          git update-ref refs/remotes/origin/main 2f0313b2d34d9e86e352273a9ef41ec27724455c
          git rev-parse HEAD HEAD^{tree} origin/main
          test -z "$(git status --porcelain)"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv pip install --system -e ".[voice,desktop]" --group dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/electron/package-lock.json
      - name: install Electron shell dependencies from its lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --prefix website/electron --no-audit --no-fund
      - name: install frontend dependencies
        run: npm ci --prefix website
      - name: pinned Semgrep unchanged diff command
        shell: bash
        run: |
          uv tool run --from "semgrep==1.78.0" semgrep scan --config semgrep/ --baseline-commit "$(git merge-base origin/main HEAD)" --error
      - name: required Electron gate
        run: npm --prefix website run test:electron
      - name: flake pattern ratchet
        env:
          FLAKE_RATCHET_BASE: 2f0313b2d34d9e86e352273a9ef41ec27724455c
        run: python -m pytest -n0 test/test_flake_pattern_ratchet.py
      - name: assert final HEAD after checks
        if: always()
        shell: bash
        run: test "$(git rev-parse HEAD)" = 9e73c90df84257c1bd20bb996fa2803d4f3de709
