name: scratch-crlf-24867-gate
on:
  push:
    branches: ["scratch/crlf-24867-gate"]
permissions:
  contents: read
jobs:
  backend-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 20e32cf04c0c2825a1ff476ff34196f97f52e2ef
          fetch-depth: 0
          persist-credentials: false
      - name: upstream main as origin/main
        shell: bash
        run: |
          git fetch --no-tags https://github.com/kirodotdev/KiroCrew.git +refs/heads/main:refs/remotes/origin/main
          git rev-parse HEAD origin/main
          git merge-base HEAD origin/main
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv pip install --system -e ".[voice,desktop]" --group dev
      - name: symlink probe
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: cd test && python -c "import conftest; print('HAS_SYMLINKS', conftest._HAS_SYMLINKS)"
      - name: required backend selection (unchanged gate command)
        shell: bash
        run: |
          BASE="$(git merge-base HEAD origin/main)" && SCOPED_TESTS_BASE_REF="$BASE" python scripts/run_scoped_tests.py --surface backend
      - name: the two nodes that need symlink privilege
        if: always()
        shell: bash
        run: |
          python -m pytest -q --no-cov -p no:cacheprovider -rfEs \
            "src/kiro_crew/apps/builtins/aws_control/crew/packaging/tests/test_concurrent_builds_and_markers.py::test_a_link_at_the_spec_itself_is_still_refused" \
            "src/kiro_crew/apps/builtins/aws_control/crew/packaging/tests/test_entry_shapes_and_preflight_order.py::test_the_report_preflight_judges_the_entry_before_reading_it"
