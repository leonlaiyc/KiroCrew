name: scratch-crlf-24867-final
on:
  workflow_dispatch:
  push:
    branches: ["scratch/codex-crlf-24867-validation-20261101"]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20e32cf04c0c2825a1ff476ff34196f97f52e2ef
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: reconstruct and assert exact final HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/kirodotdev/KiroCrew.git 078ee4f5f2732175ed83e975df87383c16f1cb5a
          git checkout --detach 078ee4f5f2732175ed83e975df87383c16f1cb5a
          git diff --binary 20e32cf04c0c2825a1ff476ff34196f97f52e2ef^ 20e32cf04c0c2825a1ff476ff34196f97f52e2ef | git apply --index
          test "$(git write-tree)" = e5a3e52efd7e28440093ac0a8c22249773618be1
          python - <<'PY'
          import subprocess
          raw = b"tree e5a3e52efd7e28440093ac0a8c22249773618be1\nparent 078ee4f5f2732175ed83e975df87383c16f1cb5a\nauthor Leon <leon.lai.yc@gmail.com> 1793100915 +0800\ncommitter Leon <leon.lai.yc@gmail.com> 1793497472 +0800\n\ntest: read contract fixtures with either newline convention\n"
          sha = subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'], input=raw).decode().strip()
          assert sha == '2f74bb747b79e1c351f587e6a2b6b73fb5ea472c', sha
          print('RECONSTRUCTED_FINAL_HEAD', sha)
          PY
          git checkout --detach 2f74bb747b79e1c351f587e6a2b6b73fb5ea472c
          git update-ref refs/remotes/origin/main 078ee4f5f2732175ed83e975df87383c16f1cb5a
          git rev-parse HEAD HEAD^{tree} origin/main
          test -z "$(git status --porcelain)"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv pip install --system -e ".[voice,desktop]" --group dev
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-tests
      - name: record runner symlink capability
        shell: bash
        run: cd test && python -c "import conftest; print('HAS_SYMLINKS', conftest._HAS_SYMLINKS)"
      - name: required backend selection unchanged
        shell: bash
        run: |
          BASE="$(git merge-base HEAD origin/main)" && SCOPED_TESTS_BASE_REF="$BASE" python scripts/run_scoped_tests.py --surface backend
      - name: explicit symlink regression nodes
        if: always()
        shell: bash
        run: |
          python -m pytest -q --no-cov -p no:cacheprovider -rfEs \
            "src/kiro_crew/apps/builtins/aws_control/crew/packaging/tests/test_concurrent_builds_and_markers.py::test_a_link_at_the_spec_itself_is_still_refused" \
            "src/kiro_crew/apps/builtins/aws_control/crew/packaging/tests/test_entry_shapes_and_preflight_order.py::test_the_report_preflight_judges_the_entry_before_reading_it"
      - name: assert final HEAD after tests
        if: always()
        shell: bash
        run: test "$(git rev-parse HEAD)" = 2f74bb747b79e1c351f587e6a2b6b73fb5ea472c
  linux-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 20e32cf04c0c2825a1ff476ff34196f97f52e2ef
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: reconstruct and assert exact final HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/kirodotdev/KiroCrew.git 078ee4f5f2732175ed83e975df87383c16f1cb5a
          git checkout --detach 078ee4f5f2732175ed83e975df87383c16f1cb5a
          git diff --binary 20e32cf04c0c2825a1ff476ff34196f97f52e2ef^ 20e32cf04c0c2825a1ff476ff34196f97f52e2ef | git apply --index
          test "$(git write-tree)" = e5a3e52efd7e28440093ac0a8c22249773618be1
          python - <<'PY'
          import subprocess
          raw = b"tree e5a3e52efd7e28440093ac0a8c22249773618be1\nparent 078ee4f5f2732175ed83e975df87383c16f1cb5a\nauthor Leon <leon.lai.yc@gmail.com> 1793100915 +0800\ncommitter Leon <leon.lai.yc@gmail.com> 1793497472 +0800\n\ntest: read contract fixtures with either newline convention\n"
          sha = subprocess.check_output(['git','hash-object','-t','commit','-w','--stdin'], input=raw).decode().strip()
          assert sha == '2f74bb747b79e1c351f587e6a2b6b73fb5ea472c', sha
          print('RECONSTRUCTED_FINAL_HEAD', sha)
          PY
          git checkout --detach 2f74bb747b79e1c351f587e6a2b6b73fb5ea472c
          git update-ref refs/remotes/origin/main 078ee4f5f2732175ed83e975df87383c16f1cb5a
          git rev-parse HEAD HEAD^{tree} origin/main
          test -z "$(git status --porcelain)"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - run: uv pip install --system -e ".[voice,desktop]" --group dev
      - name: install frontend dependencies
        run: npm ci --prefix website
      - name: pinned Semgrep unchanged diff command
        shell: bash
        run: |
          uv tool run --from "semgrep==1.78.0" semgrep scan --config semgrep/ --baseline-commit "$(git merge-base origin/main HEAD)" --error
      - name: required Electron gate
        run: npm --prefix website run test:electron
      - name: flake pattern ratchet
        env:
          FLAKE_RATCHET_BASE: 078ee4f5f2732175ed83e975df87383c16f1cb5a
        run: python -m pytest -n0 test/test_flake_pattern_ratchet.py
      - name: assert final HEAD after checks
        if: always()
        shell: bash
        run: test "$(git rev-parse HEAD)" = 2f74bb747b79e1c351f587e6a2b6b73fb5ea472c
