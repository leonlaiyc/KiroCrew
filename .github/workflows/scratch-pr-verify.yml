name: scratch-pr-verify
on:
  push:
    branches: ["scratch/pr-verify-1101"]
permissions:
  contents: read
jobs:
  win:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: symlabels-branch, ref: 646ad2a1a38e73464f0d1bc476d4838da175bd5b, files: symlabels.txt}
          - {name: symlabels-main, ref: 39f27b1262ce3e5be3f6f021edf5e2b98b2f1a86, files: symlabels.txt}
          - {name: hooksh-branch, ref: a62f92000d79b6f0f04f547497638de0a76106c5, files: hooksh.txt}
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: probe
          persist-credentials: false
      - uses: ./.github/actions/setup-windows-tests
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv pip install --system -e ".[voice,desktop]" --group dev
      - name: run
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          git rev-parse HEAD
          cd test && python -c "import conftest; print('HAS_SYMLINKS', conftest._HAS_SYMLINKS)" && cd ..
          python -m pytest -q -n auto --timeout=180 --no-cov -p no:cacheprovider -rfE $(cat probe/${{ matrix.files }})
